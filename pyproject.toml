[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sdc-parser"
version = "1.0.0"
description = "Static TCL/SDC script analyzer exporting command tables to CSV and Excel"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Tao-Lung Huang", email = "loucadgarbon@gmail.com"}]
keywords = ["tcl", "sdc", "static-analysis", "eda", "timing-constraints"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
requires-python = ">=3.10"
dependencies = ["openpyxl>=3.1", "typer>=0.12", "rich>=13"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
tclscan = "sdc_parser.cli:main"

[tool.setuptools.packages.find]
include = ["sdc_parser*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
